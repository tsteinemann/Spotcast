<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotcast</title>
<meta name="description" content="Spotcast: the forecast for where to fish. Florida fishing spots rated hourly from live tides, wind, moon and light.">
<meta name="theme-color" content="#0B1F24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotcast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Full-bleed map; search + status on top, map controls at right; one dock (bottom sheet on phones, left rail on desktop). Dark by choice: it sits on satellite imagery and gets used at dawn. */
:root{
  color-scheme: dark;
  --sea:#08161a; --panel:#0f2025; --panel-2:#162c32; --line:#24414a;
  --fg:#e9f3f1; --muted:#93aeab; --accent:#62d8c7;
  --hot:#ff5466; --great:#ffb547; --good:#7fd6ee; --fair:#71848b;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--body);background:var(--sea)}
.leaflet-control-attribution{background:rgba(8,22,26,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}

/* top */
.top{position:absolute;z-index:800;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top-main{flex:1;min-width:0;display:grid;gap:6px;pointer-events:none}
.glass{pointer-events:auto;background:rgba(15,32,37,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r)}
.search{position:relative;z-index:3;display:flex;align-items:center;height:46px;padding:0 6px 0 12px;gap:8px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--body)}
.search input::placeholder{color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--panel-2)}
.sugg{position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);list-style:none;margin:0;padding:6px;background:rgba(15,32,37,.98);border:1px solid var(--line);border-radius:var(--r);max-height:50vh;overflow:auto}
.sugg button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px;border-radius:9px;font-size:15px}
.sugg button:hover,.sugg button:focus-visible{background:var(--panel-2)}
.status{position:relative;z-index:1;padding:8px 12px;display:grid;gap:2px;min-width:0}
.status .where{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .when{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.status .cond{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.status .cond b{color:var(--fg);font-weight:600}
.btns{display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ctl{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(15,32,37,.92);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
button:focus-visible,.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.here{all:unset;position:absolute;z-index:790;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));pointer-events:auto;cursor:pointer;background:var(--accent);color:#06211d;font-family:var(--display);font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35)}

/* layers */
.layers{position:absolute;z-index:850;top:calc(60px + env(safe-area-inset-top,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 54px);width:min(290px,calc(100% - 90px));padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel-2);padding:3px;border-radius:10px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px 4px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#06211d}
.tog{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;cursor:pointer;padding:2px 0}
.tog input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.tog small{color:var(--muted);font-size:12px}
.sw{width:16px;height:12px;border-radius:3px;display:inline-block}
.depth-key{display:grid;gap:3px}
.depth-key .grad{height:10px;border-radius:5px;background:linear-gradient(90deg,#e9dea8 0%,#5cbac4 14%,#26629f 30%,#1e488a 46%,#16326a 62%,#102452 80%,#0b193c 100%)}
.depth-key .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.src{margin:0;color:var(--muted);font-size:11.5px;line-height:1.4}

/* dock */
.dock{position:absolute;z-index:700;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:46%;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.dock.detail{max-height:64%}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.dock-body{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));min-height:0;-webkit-overflow-scrolling:touch}
.timebar{flex:none;border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--t)}
.t-hot{--t:var(--hot)} .t-great{--t:var(--great)} .t-good{--t:var(--good)} .t-fair{--t:var(--fair)}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--panel-2);cursor:pointer;border-left:4px solid var(--t)}
.rank button:hover{background:#1b3640}
.rank .n{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .nm{font-weight:600;min-width:0}
.rank .why{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}
.pill{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#0b1a1e;background:var(--t);white-space:nowrap}
.kind{font-size:12px;color:var(--muted)}
.spot-head{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}
.spot-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.close{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:13px}
.best{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel-2);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.best b{font-family:var(--display);font-size:17px}
.best button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.why-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.why-list li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px;line-height:1.4}
.why-list .ic{font-family:var(--display);font-weight:700;text-align:center}
.why-list .up .ic{color:var(--accent)} .why-list .down .ic{color:var(--hot)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px}
.plan-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--accent);color:#06211d;font-family:var(--display);font-weight:700;font-size:17px}
.plan{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:14.5px;line-height:1.5}
.plan h4{margin:12px 0 4px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.plan h4:first-child{margin-top:0}
.plan ul{margin:0;padding-left:18px} .plan p{margin:0 0 6px}
.plan-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;align-items:center}
.plan-foot button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin:14px 0 4px}
.install{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0 2px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.install button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),#2f525c,var(--line));background-size:200% 100%;animation:sh 1.2s infinite linear;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:6px 0 4px;font-size:14px;line-height:1.5}
.empty b{display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 6px}
.days::-webkit-scrollbar{display:none}
.day{all:unset;box-sizing:border-box;cursor:pointer;flex:1 0 46px;text-align:center;padding:5px 3px 6px;border-radius:10px;background:var(--panel-2);border:1px solid transparent;display:grid;gap:2px}
.day .dw{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:700;font-size:16px;line-height:1}
.day .bar{height:4px;border-radius:2px;background:var(--t);margin:2px 8px 0}
.day[aria-pressed="true"]{border-color:var(--accent);background:#173a40}
.scrub-wrap{position:relative;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.scrub-wrap svg{display:block;width:100%;height:50px}
.scrub-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:2px}
.now-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.now-row .eyebrow b{color:var(--fg)}
.now-row button{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.zlabel{background:rgba(8,22,26,.82)!important;border:0!important;box-shadow:none!important;color:var(--fg)!important;font-family:var(--display);font-weight:600;font-size:12px;padding:2px 7px!important;border-radius:6px!important;white-space:nowrap}
.zlabel::before{display:none}
.lowzoom .zlabel{display:none}
.toast{position:absolute;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(50% + 10px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:900px){
  .dock{left:16px;top:16px;bottom:16px;right:auto;width:380px;max-height:none;border-radius:18px;border:1px solid var(--line)}
  .dock.detail{max-height:none}
  .grab{display:none}
  .top{left:412px;right:16px;top:16px}
  .top-main{max-width:460px}
  .here{left:calc(50% + 200px);top:170px}
  .layers{top:16px}
}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map"></div>
  <div class="top">
    <div class="top-main">
      <form class="search glass" id="searchForm" role="search" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search a Florida city or spot" aria-label="Search a Florida city or spot" enterkeyhint="search">
        <button class="icon-btn" type="button" id="locate" aria-label="Use my location"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <ul class="sugg" id="sugg" hidden></ul>
      </form>
      <div class="status glass" aria-live="polite">
        <div class="where" id="where">—</div>
        <div class="when" id="when">Loading…</div>
        <div class="cond" id="cond"></div>
      </div>
    </div>
    <div class="btns">
      <button class="ctl" id="layersBtn" type="button" aria-label="Map layers" aria-expanded="false" aria-controls="layersPanel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button class="ctl" id="zin" type="button" aria-label="Zoom in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ctl" id="zout" type="button" aria-label="Zoom out"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="ctl" id="home" type="button" aria-label="Back to this area"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <button class="here" id="here" type="button" hidden>Find spots in this area</button>
  <div class="layers glass" id="layersPanel" hidden>
    <span class="eyebrow">Map</span>
    <div class="seg" role="group" aria-label="Base map"><button type="button" data-base="sat" aria-pressed="true">Satellite</button><button type="button" data-base="relief" aria-pressed="false">Shaded relief</button></div>
    <span class="eyebrow">Overlays</span>
    <label class="tog"><input type="checkbox" id="ov-labels"><span>Place names</span><small></small></label>
    <label class="tog"><input type="checkbox" id="ov-contours"><span>Depth contours</span><small>zoom in</small></label>
    <label class="tog"><input type="checkbox" id="ov-oyster"><span>Oyster beds</span><i class="sw" style="background:#e8b45a"></i></label>
    <label class="tog"><input type="checkbox" id="ov-reefs"><span>Man-made reefs</span><i class="sw" style="background:#ff8a3d;border-radius:50%;width:12px"></i></label>
    <label class="tog"><input type="checkbox" id="ov-hardbottom"><span>Natural reef and hard bottom</span><i class="sw" style="background:#c48cff"></i></label>
    <div class="depth-key" id="depthKey" hidden><div class="grad"></div><div class="ticks"><span>0</span><span>6</span><span>15</span><span>22</span><span>35</span><span>50</span><span>70+ ft</span></div></div>
    <p class="src">Live from NOAA (depth, tides, water temp), NWS (wind), FWC (inlets, oyster beds, reefs, hard bottom) and Esri (imagery, search). Depth is approximate feet below low tide. Not for navigation.</p>
  </div>
  <section class="dock" aria-label="Fishing spots">
    <div class="grab" aria-hidden="true"></div>
    <div class="dock-body" id="body"></div>
    <div class="timebar">
      <div class="now-row"><span class="eyebrow" id="tlabel">Strike timeline</span><button type="button" id="bestBtn">Best time</button></div>
      <div class="days" id="days" role="group" aria-label="Day"></div>
      <div class="scrub-wrap" id="scrub" role="slider" tabindex="0" aria-label="Hour" aria-valuemin="0" aria-valuemax="23"><svg id="scrubSvg" viewBox="0 0 240 64" preserveAspectRatio="none"></svg></div>
      <div class="scrub-labels"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
    </div>
  </section>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script>
'use strict';
// ================= helpers
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const card = d => DIRS[Math.round(((d%360)+360)%360/22.5)%16];
const DIR_DEG = Object.fromEntries(DIRS.map((d,i)=>[d,i*22.5]));
const angDiff = (a,b) => { const d = Math.abs(((a-b)%360+360)%360); return d>180 ? 360-d : d; };
const FL = {s:24.3, w:-87.7, n:31.1, e:-79.8};
const store = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
function toast(msg, ms=3500){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, ms); }
function distKm(a,b){ const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLng=(b[1]-a[1])*Math.PI/180, la=a[0]*Math.PI/180, lb=b[0]*Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2 + Math.cos(la)*Math.cos(lb)*Math.sin(dLng/2)**2)); }
function bearing(a,b){ const y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180), x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180); return (Math.atan2(y,x)*180/Math.PI+360)%360; }
const card8 = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
async function getJSON(url, {timeout=20000}={}){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), timeout);
  try { const r = await fetch(url, {signal:ctl.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); }
}

// ================= time zone handling (labels in the location's own clock)
function tzOffsetMin(ms, tz){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(ms));
  const g = t => +p.find(x=>x.type===t).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute')) - ms)/60000;

  return HRS.map(({t}) => { let best = P[0]; for (const p of P) if (Math.abs(p.t-t) < Math.abs(best.t-t)) best = p; return [best.ws, best.wd, best.temp, best.fc]; });
}
function sunMoon(c){

  for (let x=-12; x<=H+12; x+=step){
    const t = new Date(T0 + x*3600e3), s = SunCalc.getPosition(t,c[0],c[1]).altitude*180/Math.PI, m = SunCalc.getMoonPosition(t,c[0],c[1]).altitude*180/Math.PI;
    if (pS!==null){ if (pS<-0.83 && s>=-0.83) ev.sunrise.push(x); if (pS>=-0.83 && s<-0.83) ev.sunset.push(x); }
    if (pM!==null){ if ((pM<0)!==(m<0)) ev.minor.push(x); if (ppM!==null && ((pM>ppM && pM>=m)||(pM<ppM && pM<=m))) ev.major.push(x-step); }

const nearest = (arr,x) => arr.reduce((b,v) => Math.abs(v-x) < Math.abs(b-x) ? v : b, Infinity);

// ================= scoring
function score(z,i){
  const ev = A.ev, sunAlt = SunCalc.getPosition(new Date(T0+i*3600e3), A.c[0], A.c[1]).altitude*180/Math.PI;
  let tide = 14, tideWhy = [0,''], r = 0, v = null;
  const T = A.tides[z.st];
  if (T){
    v = T.h[i]; r = (T.h[Math.min(i+1,H-1)] - T.h[Math.max(i-1,0)])/2;
    const mag = Math.abs(r), dir = r>0?'incoming':'outgoing', strength = Math.min(1, mag/0.22);
    if (mag < 0.04){ tide = 6; tideWhy = [-1,'Slack tide. Expect a slow bite until the water starts moving.']; }
    else if (z.pref==='moving'){ tide = 10 + 25*strength; tideWhy = [strength>.55?2:1, `Tide ${strength>.55?'moving well':'starting to move'}, so current is pushing bait over the structure.`]; }
    else if (dir===z.pref){ tide = 12 + 23*strength; tideWhy = [strength>.55?2:1, `${cap(dir)} tide ${strength>.55?'running well':'starting to move'}. This spot fishes best on the ${z.pref}.`]; }
    else { tide = 6 + 4*strength; tideWhy = [-1, `Tide is ${dir==='incoming'?'coming in':'going out'}. This spot fishes best on the ${z.pref}.`]; }
  } else tideWhy = [-1, 'No tide prediction for this spot, so the rating leans on wind, moon and light.'];
  const [ws, wd] = A.wx[i];
  let wind, windWhy;
  if (z.shelter){ wind = ws>14 ? 25 : 21; windWhy = [ws>14?1:0, `Protected water, so the ${ws} mph ${card(wd)} wind matters less.`]; }
  else if (z.type==='reef'){ const pen = clamp((ws-8)/10,0,1); wind = 25*(1-pen); windWhy = pen>.6 ? [-2, `${ws} mph ${card(wd)} wind. Rough for running offshore.`] : pen>.25 ? [-1, `${ws} mph ${card(wd)} wind. Expect a bumpy ride out.`] : [1, `Light ${card(wd)} wind. Good conditions to run out and anchor.`]; }
  else { const pen = clamp((ws-12)/12,0,1)*0.6; wind = 25*(1-pen); windWhy = pen>.3 ? [-1, `${ws} mph ${card(wd)} wind. Fish the protected side of the pass.`] : [1, `The ${ws} mph ${card(wd)} wind stays fishable here.`]; }
  const dM = Math.abs(nearest(ev.major,i)-i), dm = Math.abs(nearest(ev.minor,i)-i);
  const sM = dM<=1 ? 20 : dM<=2.5 ? 20*(2.5-dM)/1.5 : 0, sm = dm<=.75 ? 13 : dm<=1.5 ? 13*(1.5-dm)/.75 : 0, sol = Math.max(sM, sm);
  let solWhy = null;
  if (sol >= 10){ const mx = sM>=sm ? nearest(ev.major,i) : nearest(ev.minor,i);
    solWhy = sM>=sm ? [2, `Major feeding window: moon ${SunCalc.getMoonPosition(new Date(T0+mx*3600e3),A.c[0],A.c[1]).altitude>0?'overhead':'underfoot'} at ${hourLabel(mx)}.`] : [1, `Minor feeding window: moon on the horizon at ${hourLabel(mx)}.`]; }
  const sr = nearest(ev.sunrise,i), ss = nearest(ev.sunset,i), dS = Math.min(Math.abs(sr-i), Math.abs(ss-i));
  let light, lightWhy = null;
  if (dS <= 1.5){ light = 20; const isR = Math.abs(sr-i) < Math.abs(ss-i); lightWhy = [2, `Low light around ${isR?'sunrise':'sunset'} (${hourLabel(isR?sr:ss)}).`]; }
  else if (sunAlt < -6){ light = z.deep ? 15 : 9; lightWhy = z.type==='pass' ? [1,'Night bite. Fish lights and current lines in the pass.'] : z.type==='reef' ? [-1,'Dark offshore. Run out only if you know the water.'] : [-1,'Dark on a shallow flat. Hard to read and fish.']; }
  else { light = z.deep ? 12 : 7; if (!z.deep) lightWhy = [-1,'High sun on shallow water. Fish push to edges and shade.']; }
  const total = Math.min(100, Math.round(tide + wind + sol + light + (z.base||0)));
  const why = [tideWhy, windWhy, solWhy, lightWhy].filter(Boolean).filter(w => w[0]!==0).sort((a,b) => Math.abs(b[0])-Math.abs(a[0]) || b[0]-a[0]);
  return {total, tier:tierOf(total), why, tide:{v, r, dir: r>0?'incoming':'outgoing'}, ws, wd};
}
const bestAt = i => A.zones.map((z,k) => ({z,k,s:A.S[k][i]})).sort((a,b) => b.s.total - a.s.total);
function bestOfDay(d, k){
  const val = i => k==null ? (A.zones.length ? bestAt(i)[0].s.total : 0) : A.S[k][i].total;
  const ix = DAYS[d].idx.filter(i => HRS[i].h>=5 && HRS[i].h<=21); let best = null;
  for (const i of ix){ const v = val(i); if (!best || v>best.total) best = {i,total:v}; }
  let a=best.i, b=best.i;
  while (ix.includes(a-1) && val(a-1) >= best.total-4) a--;
  while (ix.includes(b+1) && val(b+1) >= best.total-4) b++;
  return {...best, from:a, to:b};
}

let zoneLayers = [], loadSeq = 0;
async function loadArea(lat, lng, name){

  buildClock();

  zoneLayers.forEach(l => map.removeLayer(l)); zoneLayers = [];
  ['oyster','reefs','hardbottom'].forEach(k => { if (OV[k]) map.removeLayer(OV[k]); OV[k] = null; });
  const now = (Date.now()-T0)/3600e3; cur = clamp(Math.ceil(now), 0, H-1);
  map.setView(c, 12.5);
  render();
  const dLat = 0.2, dLng = 0.22, bb = [lng-dLng, lat-dLat, lng+dLng, lat+dLat];
  const [wx, inlets, reefs, oysters, hb1, hb2] = await Promise.allSettled([
    weatherFor(c), fwcQuery(FWC.inlets, bb), fwcQuery(FWC.reefs, bb), fwcQuery(FWC.oyster, bb, {maxAllowableOffset:'0.00005', geometryPrecision:'5', outFields:'OBJECTID'}),
    fwcQuery(FWC.hb1, bb, {maxAllowableOffset:'0.00005', geometryPrecision:'5', outFields:'OBJECTID'}),
    fwcQuery(FWC.hb2, bb, {maxAllowableOffset:'0.00005', geometryPrecision:'5', outFields:'OBJECTID', where:"Geoform = 'Coral Reef and Hardbottom'"})]);
  if (seq !== loadSeq) return;
  if (wx.status==='fulfilled'){ if (wx.value.tz && wx.value.tz !== TZ){ TZ = wx.value.tz; buildClock(); A.ev = sunMoon(c); cur = clamp(Math.ceil((Date.now()-T0)/3600e3),0,H-1); } A.wx = wxSeries(wx.value.periods); }
  else A.notes.push('Wind forecast unavailable right now.');
  const val = r => r.status==='fulfilled' ? r.value : (A.notes.push('Some FWC map data did not load.'), []);
  const fReefs = val(reefs), fOy = val(oysters), fHb = val(hb1).concat(val(hb2));
  A.zones = buildZones(c, val(inlets), fReefs, fOy);
  // tides: three nearest stations, each zone uses its nearest
  const near = nearestStations(STATIONS.tide, c, 3).filter(x => x.d < 60);
  const tr = await Promise.allSettled(near.map(x => tideFor(x.s[0])));
  if (seq !== loadSeq) return;
  near.forEach((x,i) => { if (tr[i].status==='fulfilled') A.tides[x.s[0]] = Object.assign(tr[i].value, {name:x.s[3]}); });
  if (!Object.keys(A.tides).length) A.notes.push('No NOAA tide predictions near here.');

  const wt = nearestStations(STATIONS.wt, c, 1)[0];
  if (wt && wt.d < 80){ try { const j = await getJSON(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=water_temperature&station=${wt.s[0]}&date=latest&units=english&time_zone=gmt&format=json&application=spotcast`); A.waterTemp = j.data ? {v:+j.data[0].v, at:wt.s[3]} : null; } catch(e){} }

  // overlays
  OV.oyster = L.layerGroup(fOy.flatMap(f => ringsOf(f.geometry)).map(r => L.polygon(r, {pane:'habitat', color:'#ffd58a', weight:1, fillColor:'#e8b45a', fillOpacity:.75, interactive:false})));
  OV.reefs = L.layerGroup(fReefs.map(f => { const p = f.properties, la = p.Lat_DD ?? f.geometry.coordinates[1], ln = p.Long_DD ?? f.geometry.coordinates[0], v = p.MatCat==='Vessel';
    return L.circleMarker([la,ln], {pane:'habitat', radius:v?6.5:5, color:'#08161a', weight:1.5, fillColor:v?'#ffd23d':'#ff8a3d', fillOpacity:1})
      .bindPopup(`<b>${esc(p.Name||'Artificial reef')}</b><br>${p.Depth?esc(p.Depth)+' ft deep · ':''}${esc(v?'Sunken vessel':p.MatCat||'Reef')}<br>${esc(p.MatDescrip||'')}${p.DeployDate?'<br>Placed '+esc(p.DeployDate):''}<br>${(+la).toFixed(5)}, ${(+ln).toFixed(5)}`); }));

    p.bindTooltip('', {permanent:true, direction:'center', className:'zlabel', interactive:false}); p.on('click', () => selectZone(k)); return p.addTo(map); });

}

// ---- game plan (built from the spot's data)
function gamePlan(z, s, i){
  const t = s.tide, [ws, wd] = A.wx[i], slack = Math.abs(t.r||0) < .04, dir = slack ? 'slack' : t.dir;
  if (z.type==='reef') return `### Start here
${ws>15?`It is ${ws} mph out of the ${card(wd)}. Make sure the run out is safe before you go.`:`Run to ${z.gps} and idle over it to mark fish on the sounder before you anchor.`}
### How to work it
Anchor up-current so your baits settle onto the structure. ${slack?'Current is slack, so use lighter weights.':`Current is ${dir==='incoming'?'flooding':'ebbing'}; add weight to hold bottom.`}
### Baits
- Bottom: live pinfish or shrimp on a knocker rig for snapper and grouper
- Mid-water: free-lined or flat-lined baitfish for mackerel
- Sheepshead: fiddler crabs or shrimp tight to the structure
### If it's slow
Reposition 30 to 50 feet up-current, or move to the next reef on the list.`;
  if (z.type==='pass') return `### Start here
Work the ${dir==='outgoing'?'Gulf or ocean side':'bay side'} of the pass, where the ${dir==='slack'?'current will start':'current'} pushes bait off the structure. ${ws>14?`Stay on the side protected from the ${card(wd)} wind.`:''}
### How to work it
Cast up-current and let the bait swing along the seams and eddies off the jetty or bridge. Keep it near bottom.
### Lures by depth
- 6–12 ft: paddletail on a 1/4 to 3/8 oz jighead
- 12–20 ft: bucktail or jig on 1/2 to 3/4 oz along the channel edge
- Pilings and rocks: live shrimp or crabs on a short leader
### If it's slow
Wait for the tide to change, or slide to the inside corners of the pass where bait collects.`;
  return `### Start here
${dir==='incoming'?'Start on the edges of the bars as rising water floods over them.':dir==='outgoing'?'Fish the drains and cuts where water pours off the bars.':'Water is slack. Fish the deeper edges next to the bars.'} Approach quietly; this is shallow water.
### How to work it
Cast past the bar and work the bait back over the shell edge. Expect snags and use a heavier leader.
### Lures by depth
- 1–2 ft: weedless soft plastic or topwater walking bait at low light
- 2–4 ft: shrimp imitation or paddletail on a 1/8 oz jighead
- Slow bite: live shrimp under a popping cork along the edge
### If it's slow
Move to the next bar on the list and keep moving until you find fish.`;
}
function md(text){
  const out=[]; let inList=false;
  for (const raw of text.split('\n')){ const line = raw.trim(); if (!line){ if(inList){out.push('</ul>');inList=false;} continue; }
    if (/^#{1,6}\s/.test(line)){ if(inList){out.push('</ul>');inList=false;} out.push(`<h4>${esc(line.replace(/^#+\s*/,''))}</h4>`); }
    else if (/^[-*•]\s/.test(line)){ if(!inList){out.push('<ul>');inList=true;} out.push(`<li>${esc(line.replace(/^[-*•]\s*/,''))}</li>`); }
    else { if(inList){out.push('</ul>');inList=false;} out.push(`<p>${esc(line)}</p>`); } }
  if (inList) out.push('</ul>'); return out.join('');
}

  const box = $('days'), curD = HRS[cur].d;
  box.innerHTML = DAYS.map((D,d) => { const t = A.loading||!A.zones.length ? TIER[3] : tierOf(bestOfDay(d, sel).total);
    return `<button type="button" class="day t-${t[1]}" data-d="${d}" aria-pressed="${d===curD}" aria-label="${dayLabel(d)}"><span class="dw">${D.wd}</span><span class="dn">${D.dn}</span><span class="bar"></span></button>`; }).join('');
  box.querySelectorAll('.day').forEach(b => b.onclick = () => setTime(hourAt(+b.dataset.d, HRS[cur].h)));
}
function paintScrub(){
  const d = HRS[cur].d, svg = $('scrubSvg'); let g = '';
  const st = sel!=null && A.zones[sel] && A.tides[A.zones[sel].st] ? A.tides[A.zones[sel].st] : (A.stMain ? A.tides[A.stMain.s[0]] : null);
  for (let h=0; h<24; h++){
    const i = hourAt(d,h), sunAlt = SunCalc.getPosition(new Date(T0+(i+.5)*3600e3), A.c[0], A.c[1]).altitude;
    if (sunAlt < -0.0145) g += `<rect x="${h*10}" y="0" width="10" height="64" fill="#0a1a1e"/>`;
    if (!A.loading && A.zones.length){ const v = sel==null ? bestAt(i)[0].s.total : A.S[sel][i].total, t = tierOf(v), bh = Math.max(4,(v/100)*46);
      g += `<rect x="${h*10+1.5}" y="${62-bh}" width="7" height="${bh}" rx="1.5" fill="${COLORS[t[1]]}" opacity="${HRS[cur].h===h?1:.62}"/>`; }
  }
  if (st){ const vals = Array.from({length:25},(_,h)=>st.h[Math.min(hourAt(d,Math.min(h,23))+(h===24?1:0),H-1)]), lo = Math.min(...st.h), hi = Math.max(...st.h);
    g += `<polyline points="${vals.map((v,h)=>`${h*10},${(58-(v-lo)/((hi-lo)||1)*50).toFixed(1)}`).join(' ')}" fill="none" stroke="#e9f3f1" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity=".85"/>`; }
  const x = HRS[cur].h*10+5; g += `<line x1="${x}" x2="${x}" y1="0" y2="64" stroke="#62d8c7" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  svg.innerHTML = g;
  $('scrub').setAttribute('aria-valuenow', HRS[cur].h); $('scrub').setAttribute('aria-valuetext', hourLabel(cur));
  $('tlabel').innerHTML = `<b>${DAYS[d].wd}</b> · ${sel==null?'best spot':'this spot'} by hour`;
}
(function(){
  const el = $('scrub'); let drag = false;
  const at = e => { const r = el.getBoundingClientRect(); const h = clamp(Math.floor((e.clientX-r.left)/r.width*24),0,23); const i = hourAt(HRS[cur].d, h); if (i!==cur) setTime(i); };
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); at(e); });
  el.addEventListener('pointermove', e => { if (drag) at(e); });
  el.addEventListener('pointerup', () => drag = false); el.addEventListener('pointercancel', () => drag = false);
  el.addEventListener('keydown', e => { if (e.key==='ArrowRight'){ setTime(Math.min(H-1,cur+1)); e.preventDefault(); } if (e.key==='ArrowLeft'){ setTime(Math.max(0,cur-1)); e.preventDefault(); } });
})();
$('bestBtn').onclick = () => { if (A && !A.loading && A.zones.length) setTime(bestOfDay(HRS[cur].d, sel).i); };
function setTime(i){ cur = clamp(i,0,H-1); render(); }
function selectZone(k){
  sel = k; document.querySelector('.dock').classList.toggle('detail', k!=null); render();
  if (k!=null){ const wide = matchMedia('(min-width:900px)').matches;
    map.fitBounds(zoneLayers[k].getBounds(), wide ? {paddingTopLeft:[460,170], paddingBottomRight:[60,60], maxZoom:15.5} : {paddingTopLeft:[40,170], paddingBottomRight:[40, dockH()+20], maxZoom:15.5});
    $('body').scrollTop = 0; }
}
function render(){ if (!A) return; if (!A.loading && A.zones.length) paintMap(); paintStatus(); paintBody(); paintDays(); paintScrub(); }

// ================= search
const GEO = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer';
const EXT = `${FL.w},${FL.s},${FL.e},${FL.n}`;
let sTimer = null, sSeq = 0;
$('q').addEventListener('input', e => {
  clearTimeout(sTimer); const q = e.target.value.trim();
  if (q.length < 2){ $('sugg').hidden = true; return; }
  sTimer = setTimeout(async () => {
    const my = ++sSeq;
    try {
      const j = await getJSON(`${GEO}/suggest?text=${encodeURIComponent(q)}&f=json&countryCode=USA&searchExtent=${EXT}&maxSuggestions=6`);
      if (my !== sSeq) return;
      const list = j.suggestions || [];
      $('sugg').innerHTML = list.map((s,i) => `<li><button type="button" data-i="${i}">${esc(s.text)}</button></li>`).join('');
      $('sugg').hidden = !list.length;
      $('sugg').querySelectorAll('button').forEach(b => b.onclick = () => go(list[+b.dataset.i].text, list[+b.dataset.i].magicKey));
    } catch(e){ $('sugg').hidden = true; }
  }, 220);
});
$('searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('q').value.trim(); if (q) go(q); });
async function go(text, magicKey){
  $('sugg').hidden = true; $('q').blur();
  try {
    let loc = null, label = text.split(',').slice(0,2).join(',');
    try {
      const j = await getJSON(`${GEO}/findAddressCandidates?SingleLine=${encodeURIComponent(text)}${magicKey?'&magicKey='+encodeURIComponent(magicKey):''}&f=json&maxLocations=1&searchExtent=${EXT}&countryCode=USA`);
      const c0 = (j.candidates||[])[0]; if (c0) loc = [c0.location.y, c0.location.x];
    } catch(e){}
    if (!loc){ const j = await getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(text)}&format=json&limit=1&countrycodes=us&viewbox=${FL.w},${FL.n},${FL.e},${FL.s}&bounded=1`); if (j[0]) { loc = [+j[0].lat, +j[0].lon]; label = j[0].display_name.split(',').slice(0,2).join(','); } }
    if (!loc) return toast('No match in Florida. Try a city or landmark name.');
    if (loc[0] < FL.s-.3 || loc[0] > FL.n+.3 || loc[1] < FL.w-.5 || loc[1] > FL.e+.6) return toast('That place is outside Florida. Spotcast covers Florida waters.');
    $('q').value = ''; loadArea(loc[0], loc[1], label);
  } catch(e){ toast('Search is unavailable right now. Check your connection and try again.'); }
}
$('locate').onclick = () => {
  if (!navigator.geolocation) return toast('Location is not available in this browser.');
  navigator.geolocation.getCurrentPosition(p => {
    const {latitude:la, longitude:ln} = p.coords;
    if (la < FL.s-.3 || la > FL.n+.3 || ln < FL.w-.5 || ln > FL.e+.6) return toast('You are outside Florida. Search a Florida city instead.');
    loadArea(la, ln, 'My location');
  }, () => toast('Location permission was denied.'), {enableHighAccuracy:false, timeout:10000});
};

// ================= boot
(async function boot(){
  try { STATIONS = await getJSON('stations.json'); } catch(e){ STATIONS = {tide:[], wt:[]}; }
  const last = store.get('sz2-place', null) || {lat:27.632, lng:-82.72, name:'Fort De Soto, FL'};
  loadArea(last.lat, last.lng, last.name);
})();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
